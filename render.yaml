services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString

databases:
  - name: clinic-booking-db
    plan: basic-256mb
    databaseName: clinic_booking
    user: clinic_booking